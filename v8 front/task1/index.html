<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <h1 id="title">Developer Experience Survey</h1>
            <p id="description">Help us improve our platform by sharing a few details about your workflow.</p>
        </header>

        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name">Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label id="email-label" for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label id="number-label" for="number">Years of Experience</label>
                <input id="number" type="number" name="experience" min="0" max="60"
                    placeholder="Enter a number from 0 to 60">
            </div>

            <div class="form-group">
                <label for="dropdown">Current Role</label>
                <select id="dropdown" name="role" required>
                    <option value="" disabled selected>Select your current role</option>
                    <option value="student">Student</option>
                    <option value="developer">Full-Time Developer</option>
                    <option value="freelancer">Freelancer</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Would you recommend our platform?</legend>
                <label class="choice-label">
                    <input type="radio" name="recommend" value="definitely" checked>
                    Definitely
                </label>
                <label class="choice-label">
                    <input type="radio" name="recommend" value="maybe">
                    Maybe
                </label>
                <label class="choice-label">
                    <input type="radio" name="recommend" value="not-sure">
                    Not sure
                </label>
            </fieldset>

            <fieldset class="form-group">
                <legend>Which areas would you like to see improved?</legend>
                <label class="choice-label">
                    <input type="checkbox" name="improvements" value="frontend">
                    Front-end Projects
                </label>
                <label class="choice-label">
                    <input type="checkbox" name="improvements" value="backend">
                    Back-end Projects
                </label>
                <label class="choice-label">
                    <input type="checkbox" name="improvements" value="docs">
                    Documentation
                </label>
                <label class="choice-label">
                    <input type="checkbox" name="improvements" value="community">
                    Community Support
                </label>
            </fieldset>

            <div class="form-group">
                <label for="comments">Additional Comments</label>
                <textarea id="comments" name="comments" rows="4"
                    placeholder="Share any suggestions or feedback..."></textarea>
            </div>

            <button id="submit" type="submit">Submit</button>
        </form>
    </main>
</body>

</html>
